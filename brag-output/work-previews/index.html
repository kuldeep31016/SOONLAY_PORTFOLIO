<!doctype html>
<html lang="en" data-composition-variables='[{"id":"project","type":"string","label":"Project","default":"healthcare"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=880" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 880px; overflow: hidden; background: #07110f; }
      #root { position: relative; width: 1280px; height: 880px; overflow: hidden;
        background: radial-gradient(ellipse 60% 55% at 50% 55%, rgba(46, 104, 94, 0.45), transparent 70%), linear-gradient(160deg, #0e1c19, #07110f); }
      .clip { position: absolute; inset: 0; }
      #grid { position: absolute; inset: 0; opacity: 0.07;
        background-image: linear-gradient(rgba(234, 242, 239, 1) 1px, transparent 1px), linear-gradient(90deg, rgba(234, 242, 239, 1) 1px, transparent 1px);
        background-size: 44px 44px; mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black, transparent 85%); }
      #stage { position: absolute; inset: 0; }

      /* Web: browser window */
      #browser { position: absolute; left: 140px; top: 150px; width: 1000px; height: 590px; border-radius: 16px; overflow: hidden; background: #0b1614;
        border: 1px solid rgba(234, 242, 239, 0.16); box-shadow: 0 60px 120px -40px rgba(0, 0, 0, 0.85); display: none; }
      .bar { position: absolute; left: 0; right: 0; top: 0; height: 34px; background: #0d1a17; border-bottom: 1px solid rgba(234, 242, 239, 0.08); display: flex; align-items: center; gap: 7px; padding-left: 16px; z-index: 3; }
      .bar i { width: 9px; height: 9px; border-radius: 50%; background: rgba(234, 242, 239, 0.2); }
      .bar b { margin-left: 18px; width: 300px; height: 18px; border-radius: 9px; background: rgba(234, 242, 239, 0.06); }
      #viewport { position: absolute; left: 0; right: 0; top: 34px; bottom: 0; overflow: hidden; }
      .shot { position: absolute; inset: 0; background-size: cover; background-position: 50% 0%; transform-origin: 50% 30%; }
      #cursor { position: absolute; left: 0; top: 0; width: 26px; height: 26px; z-index: 5; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.45)); }
      #ripple { position: absolute; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 2px solid #9fe6cd; opacity: 0; z-index: 4; }

      /* Mobile: floating carousel */
      #carousel { position: absolute; left: 640px; top: 440px; width: 0; height: 0; display: none; }
      .item { position: absolute; left: 0; top: 0; }
      .item.phone { width: 300px; height: 630px; margin: -315px 0 0 -150px; border-radius: 44px; padding: 10px; background: linear-gradient(160deg, #1b2e2a, #0b1614);
        border: 1px solid rgba(234, 242, 239, 0.2); box-shadow: 0 50px 100px -30px rgba(0, 0, 0, 0.9); }
      .item.phone .screen { width: 100%; height: 100%; border-radius: 35px; background-size: cover; background-position: 50% 0%; }
      .item.card { width: 336px; height: 596px; margin: -298px 0 0 -168px; border-radius: 26px; overflow: hidden; box-shadow: 0 50px 100px -30px rgba(0, 0, 0, 0.9); }
      .item.card .screen { width: 100%; height: 100%; background-size: cover; background-position: 50% 50%; }
      #floor { position: absolute; left: 340px; top: 760px; width: 600px; height: 60px; border-radius: 50%; background: radial-gradient(ellipse, rgba(159, 230, 205, 0.18), transparent 70%); display: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1280" data-height="880">
      <div id="scene" class="clip" data-start="0" data-duration="9" data-track-index="0">
        <div id="grid"></div>
        <div id="stage">
          <div id="browser">
            <div class="bar"><i></i><i></i><i></i><b></b></div>
            <div id="viewport"></div>
          </div>
          <div id="floor"></div>
          <div id="carousel"></div>
          <div id="ripple"></div>
          <svg id="cursor" viewBox="0 0 26 26"><path d="M4 2 L4 21 L9 16 L12.5 23.5 L16 22 L12.6 14.6 L19.5 14.6 Z" fill="#f4fbf8" stroke="#051210" stroke-width="1.4" stroke-linejoin="round" /></svg>
        </div>
      </div>
    </div>

    <script>
      (function () {
        // Real screenshots only. Click targets are fractions of the page viewport.
        const PROJECTS = {
          healthcare: { kind: "web", targets: [[0.12, 0.72], [0.06, 0.53], [0.72, 0.42]] },
          stock: { kind: "web", targets: [[0.93, 0.12], [0.5, 0.46], [0.36, 0.34]] },
          travel: { kind: "web", targets: [[0.5, 0.63], [0.22, 0.74], [0.5, 0.46]] },
          khaata: { kind: "mobile", frame: "card" },
          dealora: { kind: "mobile", frame: "phone" },
          terminal: { kind: "mobile", frame: "phone" },
        };
        const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
        const id = PROJECTS[vars.project] ? vars.project : "healthcare";
        const P = PROJECTS[id];
        const img = (n) => `assets/img/${id}-${n}.jpg`;
        const $ = (s) => document.querySelector(s);
        const DUR = 9;
        const tl = gsap.timeline({ paused: true });

        if (P.kind === "web") {
          $("#browser").style.display = "block";
          // Four layers: shots 1-3, then shot 1 again so the loop ends where it began.
          const order = [1, 2, 3, 1];
          $("#viewport").innerHTML = order.map((n, i) => `<div class="shot" id="s${i}" style="background-image:url(${img(n)})"></div>`).join("");
          const VP = { x: 140, y: 150 + 34, w: 1000, h: 556 };
          const at = ([fx, fy]) => ({ x: VP.x + fx * VP.w, y: VP.y + fy * VP.h });
          const START = { x: 1080, y: 790 };

          gsap.set(["#s1", "#s2", "#s3"], { xPercent: 100 });
          gsap.set("#cursor", { x: START.x, y: START.y });
          // Gentle 3D sway that returns to its start at the loop point.
          gsap.set("#browser", { transformPerspective: 2200, rotationX: 3, rotationY: -5 });
          tl.to("#browser", { rotationY: 5, duration: DUR / 2, ease: "sine.inOut" }, 0);
          tl.to("#browser", { rotationY: -5, duration: DUR / 2, ease: "sine.inOut" }, DUR / 2);

          [0, 1, 2].forEach((k) => {
            const t = k * 3;
            const target = at(P.targets[k]);
            tl.fromTo("#s" + k, { scale: 1 }, { scale: 1.05, duration: 3.2, ease: "none" }, t);
            tl.to("#cursor", { x: target.x, y: target.y, duration: 1.3, ease: "power2.inOut" }, t + 0.7);
            tl.to("#cursor", { scale: 0.82, duration: 0.1, yoyo: true, repeat: 1 }, t + 2.1);
            tl.set("#ripple", { x: target.x + 6, y: target.y + 6, scale: 0.3, opacity: 0.9 }, t + 2.12);
            tl.to("#ripple", { scale: 1.3, opacity: 0, duration: 0.5, ease: "power2.out" }, t + 2.12);
            // Page transition: next screen slides in, current recedes.
            tl.to("#s" + k, { xPercent: -28, opacity: 0.35, duration: 0.6, ease: "power3.inOut" }, t + 2.4);
            tl.to("#s" + (k + 1), { xPercent: 0, duration: 0.6, ease: "power3.inOut" }, t + 2.4);
          });
          tl.to("#cursor", { x: START.x, y: START.y, duration: 0.5, ease: "power2.inOut" }, 8.45);
        } else {
          $("#carousel").style.display = "block";
          $("#floor").style.display = "block";
          $("#cursor").style.display = "none";
          $("#carousel").innerHTML = [1, 2, 3].map((n, i) => `<div class="item ${P.frame}" id="m${i}"><div class="screen" style="background-image:url(${img(n)})"></div></div>`).join("");
          const SLOTS = [
            { x: 0, scale: 1, opacity: 1, zIndex: 3 }, // centre
            { x: 350, scale: 0.78, opacity: 0.45, zIndex: 2 }, // right
            { x: -350, scale: 0.78, opacity: 0.45, zIndex: 1 }, // left
          ];
          [0, 1, 2].forEach((i) => gsap.set("#m" + i, SLOTS[i]));
          // Every 3s: centre → left, right → centre, left → (behind) → right. Three steps = back to start.
          [0, 1, 2].forEach((step) => {
            const t = step * 3 + 2.2;
            [0, 1, 2].forEach((i) => {
              const from = (i - step + 3) % 3; // slot index this item occupies before the step
              if (from === 0) tl.to("#m" + i, { ...SLOTS[2], duration: 0.8, ease: "power3.inOut" }, t);
              if (from === 1) tl.to("#m" + i, { ...SLOTS[0], duration: 0.8, ease: "power3.inOut" }, t);
              if (from === 2) {
                tl.to("#m" + i, { x: -560, opacity: 0, scale: 0.7, duration: 0.4, ease: "power2.in" }, t);
                tl.set("#m" + i, { x: 560, zIndex: 0 }, t + 0.4);
                tl.to("#m" + i, { ...SLOTS[1], duration: 0.4, ease: "power2.out" }, t + 0.4);
              }
            });
          });
          // Soft float that completes whole cycles within the loop.
          tl.fromTo("#carousel", { y: 0 }, { y: -10, duration: DUR / 4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
        }
        tl.to({}, { duration: 0.01 }, DUR - 0.01);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
