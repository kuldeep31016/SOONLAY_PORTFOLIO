<!doctype html>
<html lang="en" data-composition-variables='[{"id":"project","type":"string","label":"Project","default":"healthcare"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=880" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 880px; overflow: hidden; background: #07110f; }
      #root { position: relative; width: 1280px; height: 880px; overflow: hidden; font-family: "DM Sans", system-ui, sans-serif; color: #eaf2ef;
        background: radial-gradient(ellipse 65% 60% at 50% 42%, rgba(46, 104, 94, 0.5), transparent 70%), linear-gradient(160deg, #0e1c19, #050c0b); }
      .clip { position: absolute; inset: 0; }
      #grid { position: absolute; inset: 0; opacity: 0.06;
        background-image: linear-gradient(#eaf2ef 1px, transparent 1px), linear-gradient(90deg, #eaf2ef 1px, transparent 1px);
        background-size: 44px 44px; mask-image: radial-gradient(ellipse 70% 70% at 50% 45%, black, transparent 85%); }
      .panel { position: absolute; overflow: hidden; background: #f7f8fa; opacity: 0; box-shadow: 0 70px 140px -40px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(234, 242, 239, 0.16); }
      .panel.web { left: 120px; top: 60px; width: 1040px; height: 585px; border-radius: 16px; }
      .layer { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
      .layer img { display: block; max-width: none; }
      .hl { position: absolute; border: 3px solid #9fe6cd; border-radius: 14px; box-shadow: 0 0 24px 6px rgba(159, 230, 205, 0.55), inset 0 0 18px rgba(159, 230, 205, 0.25); opacity: 0; }
      .blur { position: absolute; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); background: rgba(247, 248, 250, 0.35); }
      .bar { position: absolute; left: 0; right: 0; top: 0; height: 36px; background: #0d1a17; display: flex; align-items: center; gap: 7px; padding-left: 16px; z-index: 2; opacity: 0; }
      .bar i { width: 10px; height: 10px; border-radius: 50%; background: rgba(234, 242, 239, 0.22); }

      /* Mobile: a device sized to the screenshot's exact aspect, so screens are never cropped */
      .device { position: absolute; background: linear-gradient(160deg, #1b2e2a, #0b1614); border: 1px solid rgba(234, 242, 239, 0.22);
        box-shadow: 0 60px 120px -30px rgba(0, 0, 0, 0.9); opacity: 0; }
      .device .screen { position: absolute; overflow: hidden; background: #0a1614; }
      .device .screen img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }

      .word { position: absolute; font-family: "Fraunces", Georgia, serif; font-weight: 400; letter-spacing: -0.02em; line-height: 1.1; overflow: hidden; padding: 0 0.1em 0.14em 0; }
      .word > span { display: inline-block; transform: translateY(110%); }
      .word em { font-style: italic; color: #9fe6cd; }
      .count { position: absolute; font-size: 18px; letter-spacing: 0.3em; color: #a9bcb6; opacity: 0; }
      #title { position: absolute; opacity: 0; }
      #title small { display: block; font-size: 17px; letter-spacing: 0.32em; text-transform: uppercase; color: #a9bcb6; margin-bottom: 14px; }
      #title b { font-family: "Fraunces", Georgia, serif; font-weight: 400; font-size: 60px; letter-spacing: -0.015em; }
      #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 75% at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.6)); pointer-events: none; }
      #fade { position: absolute; inset: 0; background: #07110f; opacity: 1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12.6" data-width="1280" data-height="880">
      <div id="scene" class="clip" data-start="0" data-duration="12.6" data-track-index="0">
        <div id="grid"></div>
        <div id="panels"></div>
        <div id="words"></div>
        <div id="title"><small></small><b></b></div>
        <div id="vignette"></div>
        <div id="fade"></div>
      </div>
    </div>

    <script>
      (function () {
        // Real screenshots only. Web crops are fractions of the image (x, y = top-left, w = width);
        // every window starts and ends in the gaps between rows so nothing meaningful is sliced.
        const WEB_SIZE = { w: 2940, h: 1670 };
        const PROJECTS = {
          healthcare: {
            kind: "web", tag: "Web platform · AI · Healthcare", name: "AI Powered Healthcare System",
            shots: [
              { img: 1, word: "Consult.", from: { x: 0.06, y: 0.14, w: 0.52 }, to: { x: 0.06, y: 0.45, w: 0.52 } },
              { img: 3, word: "Track.", from: { x: 0.21, y: 0.385, w: 0.515 }, to: { x: 0.455, y: 0.385, w: 0.515 } },
              { img: 2, word: "Diagnose with <em>AI.</em>", from: { x: 0.0, y: 0.238, w: 0.267 }, to: { x: 0.0, y: 0.232, w: 0.28 },
                highlights: [{ x: 0.008, y: 0.3, w: 0.155, h: 0.042 }, { x: 0.008, y: 0.352, w: 0.155, h: 0.042 }] },
              { img: 2, word: "Pay.", from: { x: 0.2, y: 0.06, w: 0.55 }, to: { x: 0.43, y: 0.06, w: 0.55 } },
            ],
            reveal: { img: 1, from: { x: 0.12, y: 0.06, w: 0.76 }, to: { x: 0, y: 0, w: 1 } },
          },
          stock: {
            kind: "web", tag: "Web · SaaS · Retail", name: "Stock Management System",
            shots: [
              { img: 1, word: "Stock.", from: { x: 0.175, y: 0.0, w: 0.8 }, to: { x: 0.175, y: 0.085, w: 0.8 },
                highlights: [{ x: 0.178, y: 0.178, w: 0.8, h: 0.19 }] },
              { img: 3, word: "Scan.", from: { x: 0.175, y: 0.08, w: 0.8 }, to: { x: 0.175, y: 0.2, w: 0.8 },
                highlights: [{ x: 0.558, y: 0.452, w: 0.142, h: 0.058 }, { x: 0.7, y: 0.452, w: 0.131, h: 0.058 }] },
              { img: 2, word: "Invoice.", from: { x: 0.175, y: 0.0, w: 0.8 }, to: { x: 0.175, y: 0.2, w: 0.8 },
                highlights: [{ x: 0.87, y: 0.318, w: 0.108, h: 0.05 }],
                // Customer phone numbers are blurred.
                blurs: [{ x: 0.49, y: 0.4, w: 0.083, h: 0.6 }] },
            ],
            reveal: { img: 1, from: { x: 0.12, y: 0.06, w: 0.76 }, to: { x: 0, y: 0, w: 1 } },
          },
          travel: {
            kind: "web", tag: "Web · Travel · Booking", name: "Travel Booking Website",
            shots: [
              { img: 1, word: "Explore.", from: { x: 0.17, y: 0.3, w: 0.56 }, to: { x: 0.11, y: 0.24, w: 0.68 } },
              { img: 2, word: "Choose.", from: { x: 0.08, y: 0.105, w: 0.7 }, to: { x: 0.225, y: 0.105, w: 0.7 },
                highlights: [{ x: 0.376, y: 0.698, w: 0.1, h: 0.058 }] },
              { img: 3, word: "Discover.", from: { x: 0.075, y: 0.06, w: 0.84 }, to: { x: 0.075, y: 0.165, w: 0.84 },
                highlights: [{ x: 0.37, y: 0.385, w: 0.253, h: 0.28 }] },
            ],
            reveal: { img: 1, from: { x: 0.12, y: 0.06, w: 0.76 }, to: { x: 0, y: 0, w: 1 } },
          },
          khaata: {
            kind: "mobile", frame: "card", ratio: 790 / 1400, tag: "Mobile app · Billing", name: "Apna Khaata",
            shots: [{ img: 1, word: "Bill." }, { img: 2, word: "Get <em>paid.</em>" }, { img: 3, word: "Stay synced." }],
          },
          dealora: {
            kind: "mobile", frame: "phone", ratio: 402 / 874, tag: "Mobile app · Savings", name: "Dealora",
            shots: [{ img: 1, word: "Save." }, { img: 2, word: "Browse." }, { img: 3, word: "Redeem." }],
          },
          terminal: {
            kind: "mobile", frame: "phone", ratio: 702 / 1600, tag: "Android · Developer tool", name: "Terminal Emulator",
            shots: [{ img: 1, word: "Boot." }, { img: 3, word: "Run." }, { img: 2, word: "<em>Results.</em>" }],
          },
        };

        const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
        const id = PROJECTS[vars.project] ? vars.project : "healthcare";
        const P = PROJECTS[id];
        const N = P.shots.length;
        const $ = (s) => document.querySelector(s);
        const panels = $("#panels"), words = $("#words");
        const src = (n) => `assets/img/${id}-${n}.jpg`;
        $("#title small").textContent = P.tag;
        $("#title b").textContent = P.name;

        const tl = gsap.timeline({ paused: true });
        tl.to("#fade", { opacity: 0, duration: 0.5, ease: "power2.out" }, 0);
        const END = 12.0; // fade to the empty stage, loop restarts at 12.6
        const REVEAL_LEN = 2.45;
        const SHOT = (END - REVEAL_LEN - 0.2) / N;
        const count = (i) => `0${i + 1} / 0${N}`;

        if (P.kind === "web") {
          const PW = 1040, IW = WEB_SIZE.w, IH = WEB_SIZE.h;
          const cam = (c) => { const s = PW / (c.w * IW); return { scale: s, x: -c.x * IW * s, y: -c.y * IH * s }; };
          const rect = (r, cls, idAttr) => `<div class="${cls}"${idAttr ? ` id="${idAttr}"` : ""} style="left:${r.x * IW}px;top:${r.y * IH}px;width:${r.w * IW}px;height:${r.h * IH}px"></div>`;
          [...P.shots, P.reveal].forEach((sh, i) => {
            const isReveal = i === N;
            const extras = (sh.blurs || []).map((b) => rect(b, "blur")).join("") +
              (sh.highlights || []).map((h, j) => rect(h, "hl", `hl${i}-${j}`)).join("");
            panels.insertAdjacentHTML("beforeend",
              `<div class="panel web" id="p${i}">${isReveal ? '<div class="bar"><i></i><i></i><i></i></div>' : ""}<div class="layer" id="l${i}"><img src="${src(sh.img)}" style="width:${IW}px;height:${IH}px" alt="" />${extras}</div></div>`);
            if (!isReveal) words.insertAdjacentHTML("beforeend",
              `<div class="word" id="w${i}" style="left:118px;top:676px;font-size:104px"><span>${sh.word}</span></div><div class="count" id="c${i}" style="right:122px;top:726px">${count(i)}</div>`);
          });
          P.shots.forEach((sh, i) => {
            const t = 0.15 + i * SHOT, p = "#p" + i, l = "#l" + i;
            gsap.set(l, cam(sh.from));
            tl.fromTo(p, { opacity: 1, x: 30, clipPath: "inset(0% 0% 0% 100% round 16px)" },
              { x: 0, clipPath: "inset(0% 0% 0% 0% round 16px)", duration: 0.55, ease: "power3.out" }, t);
            tl.to(l, { ...cam(sh.to), duration: SHOT - 0.2, ease: "power2.inOut" }, t + 0.15);
            (sh.highlights || []).forEach((_, j) =>
              tl.fromTo(`#hl${i}-${j}`, { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, t + 0.8 + j * 0.3));
            tl.to(`#w${i} > span`, { y: "0%", duration: 0.6, ease: "power4.out" }, t + 0.2);
            tl.fromTo("#c" + i, { opacity: 0 }, { opacity: 1, duration: 0.4 }, t + 0.3);
            tl.to(`#w${i} > span`, { y: "-110%", duration: 0.35, ease: "power3.in" }, t + SHOT - 0.4);
            tl.to("#c" + i, { opacity: 0, duration: 0.25 }, t + SHOT - 0.4);
            tl.to(p, { opacity: 0, x: -30, duration: 0.3, ease: "power2.in" }, t + SHOT - 0.35);
          });
          const tr = 0.15 + N * SHOT + 0.05, r = "#l" + N;
          gsap.set(r, { ...cam(P.reveal.from), y: cam(P.reveal.from).y + 36 });
          tl.fromTo("#p" + N, { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, tr);
          tl.to(r, { ...cam(P.reveal.to), y: 36, duration: 1.5, ease: "power3.inOut" }, tr + 0.1);
          tl.to(`#p${N} .bar`, { opacity: 1, duration: 0.4 }, tr + 0.9);
          gsap.set("#title", { left: 122, top: 684 });
          tl.fromTo("#title", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, tr + 1.0);
        } else {
          // Device sized to the screenshot aspect: the whole screen is always visible.
          const phone = P.frame === "phone";
          const SH = phone ? 700 : 720; // screen height
          const SW = Math.round(SH * P.ratio);
          const bez = phone ? 11 : 0;
          const DW = SW + bez * 2, DH = SH + bez * 2;
          const DX = 330 - DW / 2, DY = (880 - DH) / 2;
          const radius = phone ? 46 : 28;
          const bare = phone ? "" : "border:none;background:none;";
          panels.insertAdjacentHTML("beforeend",
            `<div class="device" id="dev" style="left:${DX}px;top:${DY}px;width:${DW}px;height:${DH}px;border-radius:${radius}px;${bare}">` +
            `<div class="screen" style="left:${bez}px;top:${bez}px;width:${SW}px;height:${SH}px;border-radius:${radius - bez}px">` +
            P.shots.map((sh, i) => `<img id="m${i}" src="${src(sh.img)}" alt="" />`).join("") + `</div></div>`);
          P.shots.forEach((sh, i) => words.insertAdjacentHTML("beforeend",
            `<div class="word" id="w${i}" style="left:600px;top:330px;font-size:120px"><span>${sh.word}</span></div><div class="count" id="c${i}" style="left:606px;top:500px">${count(i)}</div>`));
          // Reveal: all screens side by side, whole.
          const RH = phone ? 540 : 560, RW = Math.round(RH * P.ratio), rb = phone ? 9 : 0, GAP = 44, rr = phone ? 38 : 22;
          const total = 3 * (RW + rb * 2) + 2 * GAP, rx0 = (1280 - total) / 2;
          P.shots.forEach((sh, i) => panels.insertAdjacentHTML("beforeend",
            `<div class="device" id="r${i}" style="left:${rx0 + i * (RW + rb * 2 + GAP)}px;top:70px;width:${RW + rb * 2}px;height:${RH + rb * 2}px;border-radius:${rr}px;${bare}">` +
            `<div class="screen" style="left:${rb}px;top:${rb}px;width:${RW}px;height:${RH}px;border-radius:${rr - rb}px"><img src="${src(sh.img)}" alt="" /></div></div>`));

          gsap.set(P.shots.slice(1).map((_, i) => "#m" + (i + 1)), { yPercent: 100 });
          tl.fromTo("#dev", { opacity: 0, y: 40, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 0.15);
          tl.fromTo("#dev", { rotation: -1.5 }, { rotation: 1.5, duration: N * SHOT, ease: "sine.inOut" }, 0.15);
          P.shots.forEach((sh, i) => {
            const t = 0.15 + i * SHOT;
            if (i > 0) {
              // Screen change like app navigation: the new screen slides up over the old one.
              tl.to("#m" + (i - 1), { yPercent: -18, opacity: 0.4, duration: 0.55, ease: "power3.inOut" }, t - 0.1);
              tl.to("#m" + i, { yPercent: 0, duration: 0.55, ease: "power3.inOut" }, t - 0.1);
            }
            tl.to(`#w${i} > span`, { y: "0%", duration: 0.6, ease: "power4.out" }, t + 0.25);
            tl.fromTo("#c" + i, { opacity: 0 }, { opacity: 1, duration: 0.4 }, t + 0.35);
            tl.to(`#w${i} > span`, { y: "-110%", duration: 0.35, ease: "power3.in" }, t + SHOT - 0.45);
            tl.to("#c" + i, { opacity: 0, duration: 0.25 }, t + SHOT - 0.45);
          });
          const tr = 0.15 + N * SHOT;
          tl.to("#dev", { opacity: 0, scale: 0.94, duration: 0.4, ease: "power2.in" }, tr - 0.35);
          P.shots.forEach((_, i) =>
            tl.fromTo("#r" + i, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, tr + 0.05 + i * 0.12));
          gsap.set("#title", { left: 0, right: 0, top: 690, textAlign: "center" });
          tl.fromTo("#title", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, tr + 0.6);
        }
        tl.to("#fade", { opacity: 1, duration: 0.55, ease: "power2.in" }, END);
        tl.to({}, { duration: 0.01 }, 12.59);

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
